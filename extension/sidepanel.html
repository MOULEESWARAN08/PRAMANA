<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Vision Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      font-size: 13px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #10b981;
      color: #022c22;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    textarea, input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      resize: vertical;
    }
    textarea:focus, input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #runBtn { background: #3b82f6; color: white; }
    #stopBtn { background: #ef4444; color: white; }
    #status {
      margin-top: 16px;
      padding: 10px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 12px;
      min-height: 40px;
      border-left: 3px solid #3b82f6;
    }
    #log {
      margin-top: 12px;
      max-height: 400px;
      overflow-y: auto;
      font-family: "SF Mono", Monaco, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .log-entry {
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: #1e293b;
      border-left: 3px solid #475569;
    }
    .log-entry.action { border-left-color: #10b981; }
    .log-entry.error { border-left-color: #ef4444; background: #2a1a1a; }
    .log-entry.done { border-left-color: #f59e0b; }
    .progress-bar {
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Privacy Vision Agent <span class="badge">LOCAL</span></h1>

  <label for="taskInput">Task</label>
  <textarea id="taskInput" rows="3" placeholder="e.g. Log into my email and check the latest message from my bank"></textarea>

  <button id="runBtn">▶ Run Agent</button>
  <button id="stopBtn" disabled>■ Stop</button>

  <div id="status">Idle. Enter a task and click Run.</div>

  <div id="log"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
